<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SkillBuddy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page-body">

    <div class="login-card">
        <h2>Create Your Account 🚀</h2>
        <p>Join SkillBuddy to start your learning journey.</p>
        
        <form id="signup-form">
            <div class="form-group">
                <input type="text" id="fullName" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Create Password" required>
            </div>
            <div class="form-group">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="cta-button" id="create-account-btn">Create Account</button>
            </div>
        </form>
        
        <p class="form-footer">
            Already have an account? <a href="index.html">Log In</a>
        </p>
    </div>

    <script src="script.js"></script>
</body>
</html>
